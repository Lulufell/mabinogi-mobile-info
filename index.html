<style>
  :root { --ink:#20242a; --muted:#727b85; --paper:#f5f6f8; --line:#e1e4e8; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:Arial,"Malgun Gothic","Noto Sans KR",sans-serif; }
  main { max-width:760px; min-height:100vh; margin:0 auto; padding:48px 20px 56px; display:flex; flex-direction:column; justify-content:center; }
  .intro { margin:0 0 34px; color:var(--muted); letter-spacing:.02em; }
  .intro strong { display:block; color:var(--ink); font-size:18px; font-weight:700; }
  .intro span { display:block; margin-top:5px; font-size:13px; }
  .sections { border-top:1px solid var(--line); }
  .section { padding:25px 0 26px; border-bottom:1px solid var(--line); }
  h2 { margin:0 0 6px; font-size:13px; letter-spacing:.12em; }
  .label { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .links { display:grid; gap:8px; }
  a { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 15px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a:hover, a:focus-visible { border-color:#8b949e; transform:translateY(-1px); outline:none; }
  .name { font-size:15px; font-weight:700; }
  .arrow { color:var(--muted); font-size:18px; line-height:1; }
  footer { margin-top:26px; color:#9299a1; font-size:11px; }
  @media (max-width:560px) { main { padding:36px 16px; } }
</style>
</head>
